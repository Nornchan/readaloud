# Voice table for readaloud's engines — data, not code (SPEC.md section 3),
# so a voice preference, a new voice, or an accent's display name can be
# changed here without touching Python.
#
# Kept as stdlib TOML rather than YAML+PyYAML: see SPEC.md Appendix B.6 for
# why — one config file this size did not justify a new Homebrew resource.
#
# accent_names names every --accent code in English, for error messages,
# independent of which engines happen to support it.
[accent_names]
us = "American"
uk = "British"
au = "Australian"
ie = "Irish"
in = "Indian"
za = "South African"
nz = "New Zealand"
ca = "Canadian"

# --- kokoro ------------------------------------------------------------
#
# Kokoro-82M covers American and British English only (SPEC.md Appendix
# B.3). `accents` is the hard boundary `resolve()` checks against;
# `nearest_accent` only makes the resulting error message useful — it is
# never used to substitute silently. Within a (accent, gender) group,
# `voices` is listed in preference order (best grade first); the grade is
# Kokoro's own, from its VOICES.md.

[kokoro]
accents = ["us", "uk"]

[kokoro.nearest_accent]
au = "uk"
nz = "uk"
ie = "uk"
za = "uk"
in = "uk"
ca = "us"

[[kokoro.voices]]
id = "af_heart"
accent = "us"
gender = "female"
grade = "A"

