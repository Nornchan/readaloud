[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readaloud"
version = "0.2.0"
description = "Turn a web article, HTML file, or PDF into a listenable audio file."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "norachan" }]
keywords = ["tts", "text-to-speech", "audio", "article", "pdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Every runtime dependency becomes a Homebrew `resource` block someone has to
# maintain, so they get added one milestone at a time as they are actually
# used. Milestone 2 adds fetching and extraction.
dependencies = [
  "httpx>=0.27",        # fetch
  "trafilatura>=2.0",   # HTML main-content extraction
  "pymupdf>=1.24",      # PDF text and geometry
  "kokoro-onnx>=0.4",   # local neural TTS through onnxruntime — no torch
  "numpy>=1.26",        # float32 samples out of kokoro
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
readaloud = "readaloud.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/Nornchan/readaloud"

[tool.setuptools.packages.find]
where = ["src"]

# voices.toml (milestone 6) is data the package ships, not code — setuptools
# only bundles .py files from a found package by default, so it needs to be
# named explicitly or it silently isn't in the wheel.
[tool.setuptools.package-data]
readaloud = ["voices.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_engine: uses a real TTS backend instead of the fake one",
]
